# nginx.conf — hardened configuration for SecureVault frontend
# Paper [11] (Jarkas et al.): minimal attack surface, non-root, secure defaults
# Paper [12] (Lee et al.): network isolation — API proxied to backend service

# No 'user' directive: Docker runs the process as the nginx user via USER in
# Dockerfile. Including 'user' here would attempt a setuid which non-root
# processes cannot perform.
worker_processes auto;

# Write PID to /tmp so the nginx user can create it without root.
pid /tmp/nginx.pid;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Redirect all nginx temp file writes to /tmp (writable by nginx user,
    # mounted as tmpfs in docker-compose for read_only container support).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile           on;
    keepalive_timeout  65;

    # Paper [11]: hide server version to reduce information leakage.
    server_tokens off;

    # Gzip static assets
    gzip            on;
    gzip_vary       on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript;

    server {
        # Port 8080: binding to privileged port 80 requires CAP_NET_BIND_SERVICE.
        # Using 8080 lets the container run entirely as non-root (Paper [11]).
        listen 8080;
        listen [::]:8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # ── Security headers ────────────────────────────────────────────────
        # Paper [11]: defence-in-depth response headers.

        # Prevent MIME-type sniffing attacks
        add_header X-Content-Type-Options   "nosniff"                         always;

        # Prevent clickjacking — no iframes
        add_header X-Frame-Options          "DENY"                            always;

        # Legacy XSS filter for older browsers (CSP nonces are the primary defence)
        add_header X-XSS-Protection         "1; mode=block"                   always;

        # Limit referrer data sent across origins
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

        # Restrict browser APIs that are not needed by this app
        add_header Permissions-Policy       "geolocation=(), camera=(), microphone=(), payment=()" always;

        # Force HTTPS in production (HSTS — 1 year, include subdomains)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── SPA routing ─────────────────────────────────────────────────────
        # All non-asset requests fall back to index.html for client-side routing.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache-bust hashed static assets aggressively
        location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ── API proxy ────────────────────────────────────────────────────────
        # Paper [12]: frontend never reaches the DB or ML service directly.
        # All /api/ traffic is forwarded to the backend service on backend-net.
        location /api/ {
            proxy_pass         http://backend:3001;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;

            # Limit upload size — backend enforces 50 MB, nginx enforces 55 MB
            client_max_body_size 55m;
        }

        # ── Deny hidden files ────────────────────────────────────────────────
        location ~ /\. {
            deny all;
        }
    }
}
