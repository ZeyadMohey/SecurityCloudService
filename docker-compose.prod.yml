# docker-compose.prod.yml — Production overrides for SecureVault
#
# Paper [15] (Sinan et al.): Docker Secrets replace environment-variable
# credentials. Secrets are mounted as read-only files at /run/secrets/<name>
# inside each container and are never visible in `docker inspect` output,
# container logs, or the image layers.
#
# Usage:
#   ./scripts/init-secrets.sh          # generate ./secrets/*.txt
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# The backend reads secrets via backend/src/config/secrets.ts which checks
# /run/secrets/<name> before falling back to environment variables.

secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  master_key:
    file: ./secrets/master_key.txt

services:

  db:
    environment:
      POSTGRES_USER: securevault
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: securevault
    secrets:
      - db_password

  backend:
    environment:
      NODE_ENV: production
      PORT: 3001
      # DATABASE_URL: password is a placeholder — secrets.ts replaces __DB_PASSWORD__
      # at runtime with the content of /run/secrets/db_password (Paper [15]).
      DATABASE_URL: postgresql://securevault:__DB_PASSWORD__@db:5432/securevault
      ML_SERVICE_URL: http://ml-service:8000
      # JWT_SECRET and MASTER_ENCRYPTION_KEY are NOT set here.
      # secrets.ts reads /run/secrets/jwt_secret and /run/secrets/master_key directly.
    secrets:
      - db_password
      - jwt_secret
      - master_key
    # Production: no host port — put a reverse proxy (nginx/Caddy) in front
    ports: []

  frontend:
    # Production: serve on standard port 80 (mapped from internal 8080)
    ports:
      - '80:8080'

  ml-service:
    # No secrets needed — model weights are baked into the image
    environment: {}
