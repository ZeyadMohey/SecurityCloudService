# docker-compose.prod.yml  Production overrides for SecureVault
#
# Docker Secrets replace env-var credentials. Secrets are mounted as read-only
# files at /run/secrets/<name> and are never visible in `docker inspect` output.
#
# Usage:
#   ./scripts/init-secrets.sh          # generate ./secrets/*.txt
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Secrets are read by backend/src/config/secrets.ts at runtime.

secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  master_key:
    file: ./secrets/master_key.txt

services:
  db:
    environment:
      POSTGRES_USER: securevault
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: securevault
    secrets:
      - db_password

  backend:
    environment:
      NODE_ENV: production
      PORT: 3001
      # __DB_PASSWORD__ is replaced at runtime by secrets.ts with /run/secrets/db_password.
      DATABASE_URL: postgresql://securevault:__DB_PASSWORD__@db:5432/securevault
      ML_SERVICE_URL: http://ml-service:8000
      # JWT_SECRET and MASTER_ENCRYPTION_KEY are NOT set here.
      # secrets.ts reads /run/secrets/jwt_secret and /run/secrets/master_key directly.
    secrets:
      - db_password
      - jwt_secret
      - master_key
    # Production: no host port  put a reverse proxy (nginx/Caddy) in front
    ports: []

  frontend:
    # Production: serve on standard port 80 (mapped from internal 8080)
    ports:
      - "80:8080"

  ml-service:
    # No secrets needed  model weights are baked into the image
    environment: {}
